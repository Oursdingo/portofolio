<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message envoyé — Sawadogo Adam Sharif</title>
  <meta name="robots" content="noindex" />

    <script>
      (function () {
        var m = null;
        try { m = localStorage.getItem("theme-mode"); } catch (e) {}
        if (m !== "light" && m !== "dark") m = "auto";
        var t = m === "auto"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : m;
        document.documentElement.setAttribute("data-theme-mode", m);
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Sora:wght@600..700&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    .thanks {
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      text-align: center;
      gap: var(--space-4);
      padding: var(--space-8);
    }

    .thanks__title {
      font-size: var(--fs-3xl);
    }

    .thanks__text {
      color: var(--text-muted);
      max-width: 44ch;
    }

    .thanks .btn {
      margin-top: var(--space-4);
    }
  </style>
</head>

<body>
  <main class="thanks">
    <svg class="thanks__mark" viewBox="0 0 32 32" width="64" height="64" aria-hidden="true">
      <g fill="none" stroke="var(--logo-red)" stroke-width="2.8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 10 L5 16 L10 22" />
        <path d="M19 8.5 L13 23.5" />
        <path d="M22 10 L27 16 L22 22" />
      </g>
    </svg>
    <h1 class="thanks__title">Message bien reçu</h1>
    <p class="thanks__text">
      Merci de m'avoir écrit. Je vous réponds dans les meilleurs délais.
    </p>
    <a href="index.html" class="btn btn--primary">Retour au portfolio</a>
  </main>
</body>

</html>
